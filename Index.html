<!DOCTYPE html>

<html lang="hr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NBA Predictor</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#10131c;color:#fff;font-family:Arial,sans-serif}

header{background:#191f2e;padding:22px 18px;border-bottom:2px solid #e66b25}

h1{margin:0;color:#ff873e;font-size:27px}

header p{color:#aeb7c9;margin:7px 0 0}

main{padding:16px;max-width:700px;margin:auto}

nav{display:flex;gap:7px;overflow:auto;margin-bottom:18px}

nav button{white-space:nowrap;background:#252d3e;color:white;border:0;border-radius:9px;padding:12px}

nav button.active{background:#e66b25}

h2{font-size:19px}

.card{background:#1c2332;border:1px solid #30394d;border-radius:13px;padding:15px;margin:12px 0}

.muted{color:#aab4c5;font-size:13px}

.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #30394d}

.green{color:#54dc9b}

.orange{color:#ff9b55}

input,select{width:100%;padding:12px;margin:7px 0;background:#111827;color:white;border:1px solid #46516a;border-radius:8px}

.action{background:#e66b25;color:white;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:8px}
